name: QA Automation Framework - CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run tests on"
        required: false
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - edge
  schedule:
    # Nightly regression run at 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  test:
    name: Run Selenium Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Google Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Create required directories
        run: mkdir -p logs screenshots reports/allure-results reports/html-report

      - name: Run test suite (headless)
        env:
          CI: "true"
        run: |
          pytest --browser=${{ matrix.browser }} --headless=true --env=qa -m "smoke or regression" \
            --alluredir=reports/allure-results \
            --html=reports/html-report/report_${{ matrix.browser }}.html \
            --self-contained-html \
            --reruns 1 --reruns-delay 2
        continue-on-error: true

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          allure_results: reports/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.browser }}
          path: reports/html-report/
          retention-days: 30

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-history/
          retention-days: 30

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs-${{ matrix.browser }}
          path: logs/
          retention-days: 15

      - name: Upload screenshots (failures only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: screenshots/
          retention-days: 15
          if-no-files-found: ignore

      - name: Upload execution summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-summary-${{ matrix.browser }}
          path: reports/execution_summary.json
          if-no-files-found: ignore

  publish-report:
    name: Publish Allure Report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && always()
    permissions:
      contents: write
    steps:
      - name: Download Allure report (chrome)
        uses: actions/download-artifact@v4
        with:
          name: allure-report-chrome
          path: allure-history

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
