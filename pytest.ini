[pytest]
; ==========================================================
; PyTest Configuration - QA Automation Framework
; ==========================================================

minversion = 8.0

; Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Default command-line options appended to every run
; --alluredir       -> collects Allure results
; --html             -> generates a self-contained HTML report
; --self-contained-html -> embeds CSS/JS/screenshots directly into HTML
; -v                 -> verbose output
; --reruns / --reruns-delay -> auto-retry flaky tests
addopts =
    -v
    --alluredir=reports/allure-results
    --html=reports/html-report/report.html
    --self-contained-html
    --reruns 1
    --reruns-delay 2
    --capture=sys

; Custom markers
markers =
    smoke: Quick sanity/smoke test suite
    regression: Full regression suite
    login: Login page test cases
    inventory: Inventory/Products page test cases
    cart: Shopping cart test cases
    checkout: Checkout flow test cases
    logout: Logout / session test cases
    negative: Negative / invalid-input test cases
    security: Security-oriented input tests (SQLi, XSS, etc.)

; Logging (captured into logs/ via our custom logger + this section)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

; Fail on unregistered/unknown markers to keep suite clean
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
