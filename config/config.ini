; ==========================================================
; QA Automation Framework - Central Configuration
; ==========================================================
; This file drives the entire framework's runtime behaviour.
; Values here can be overridden via command-line arguments
; (see conftest.py / utilities/config_reader.py).
; ==========================================================

[ENV]
; Active environment block to use from below (qa / staging / prod)
active_env = qa

[qa]
base_url = https://www.saucedemo.com/
browser = chrome
headless = false
implicit_wait = 10
explicit_wait = 15
page_load_timeout = 30

[staging]
base_url = https://www.saucedemo.com/
browser = chrome
headless = true
implicit_wait = 10
explicit_wait = 15
page_load_timeout = 30

[prod]
base_url = https://www.saucedemo.com/
browser = chrome
headless = true
implicit_wait = 10
explicit_wait = 15
page_load_timeout = 30

[CREDENTIALS]
; Default / primary user (also duplicated in testdata/login_data.xlsx
; for data-driven tests - this section is used for quick smoke tests)
standard_user = standard_user
locked_out_user = locked_out_user
problem_user = problem_user
performance_glitch_user = performance_glitch_user
error_user = error_user
visual_user = visual_user
password = secret_sauce

[REPORTING]
allure_results_dir = reports/allure-results
allure_report_dir = reports/allure-report
html_report_dir = reports/html-report
screenshot_dir = screenshots
log_dir = logs

[EXECUTION]
; Default browser resolution when not headless
window_width = 1920
window_height = 1080
; Number of parallel workers for pytest-xdist ( "auto" or an integer )
parallel_workers = auto
